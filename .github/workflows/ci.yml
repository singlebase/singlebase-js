name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm run format:check

      - name: Build
        run: pnpm run build

      - name: Types
        run: pnpm run typecheck

      # The UI package runs its suite in headless Chromium, which
      # @web/test-runner launches via Puppeteer's bundled browser.
      - name: Test
        run: pnpm run test
